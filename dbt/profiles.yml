# Copy to ~/.dbt/profiles.yml (or use --profiles-dir .). Never commit real credentials.
mortgage_underwriting:
  target: dev
  outputs:
    dev:
      type: snowflake
      account: "{{ env_var('SNOWFLAKE_ACCOUNT') }}"
      user: "{{ env_var('SNOWFLAKE_USER') }}"
      private_key_path: "{{ env_var('SNOWFLAKE_PRIVATE_KEY_PATH') }}"   # prefer key-pair auth in prod
      role: MORTGAGE_TRANSFORMER_ROLE
      warehouse: MORTGAGE_TRANSFORM_WH
      database: MORTGAGE_DEV
      schema: staging
      threads: 4
    prod:
      type: snowflake
      account: "{{ env_var('SNOWFLAKE_ACCOUNT') }}"
      user: "{{ env_var('SNOWFLAKE_USER') }}"
      private_key_path: "{{ env_var('SNOWFLAKE_PRIVATE_KEY_PATH') }}"
      role: MORTGAGE_TRANSFORMER_ROLE
      warehouse: MORTGAGE_TRANSFORM_WH
      database: MORTGAGE_PROD
      schema: staging
      threads: 8
