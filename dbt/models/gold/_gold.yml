version: 2
models:
  - name: fct_underwriting_decisions
    description: Immutable underwriting decision log with reason codes and the exact inputs used.
    columns:
      - name: decision_id
        tests: [not_null, unique]
      - name: application_id
        tests:
          - not_null
          - unique
          - relationships:
              arguments:
                to: ref('silver_loan_applications')
                field: application_id
      - name: decision_status
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: [APPROVED, DECLINED, REQUIRES_COSIGNER]
      - name: primary_reason_code
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_reason_codes')
                field: reason_code
      - name: ltv_pct
        tests: [not_null]
      - name: dti_pct
        tests: [not_null]
  - name: agg_decision_summary
    columns:
      - name: application_count
        tests: [not_null]
  - name: agg_denial_reasons
    columns:
      - name: reason_code
        tests:
          - relationships:
              arguments:
                to: ref('dim_reason_codes')
                field: reason_code
  - name: hmda_lar_report
    columns:
      - name: application_id
        tests: [not_null, unique]
