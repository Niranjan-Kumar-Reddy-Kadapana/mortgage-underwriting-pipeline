name: ci
on:
  pull_request:
  push:
    branches: [main]

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install pytest ruff
      - run: ruff check .
      - run: pytest -q          # boundary tests on the reference underwriting rules

  terraform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - run: terraform -chdir=terraform fmt -check -recursive
      - run: terraform -chdir=terraform init -backend=false
      - run: terraform -chdir=terraform validate

  dbt-parse:
    # Compiles the whole project (Jinja, refs, YAML) without touching Snowflake.
    runs-on: ubuntu-latest
    env:
      SNOWFLAKE_ACCOUNT: dummy
      SNOWFLAKE_USER: dummy
      SNOWFLAKE_PASSWORD: dummy
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install "dbt-snowflake>=1.8,<2.0"
      - run: cp dbt/profiles.yml.example dbt/profiles.yml
      - run: cd dbt && dbt parse --profiles-dir .
